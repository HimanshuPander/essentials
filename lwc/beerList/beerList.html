<template>
    <div style="background: rgb(70, 61, 61); border-radius: 10px;">
        
        <div style="border: 2px solid rgb(255, 255, 255); width: 30px; height: 30px; border-radius: 50%; 
                margin-top : 25px;
                right : 80px;
                position : absolute;
                vertical-align : center;
                text-align: center;
                font-size: 19px;"
            > 
            <strong class="slds-m-top_small" style="text-align:center; vertical-align:center; color : white;">{itemsinCart}</strong>
        </div>
        <div style="float: right;" >
            <a href="JavaScript:void(0);" onclick={navigateToCartDetail}>
            <img src={cart} height="80" width="80" /> 
            </a>
        </div>
        
        <div class="slds-m-left_small slds-m-right_small slds-m-bottom_small">
            <c-beer-search onsearch={handleEvent} ></c-beer-search>
        </div>
        <div class="slds-m-left_small slds-m-right_small slds-m-bottom_small">
            <template if:true={beerRecords} >
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={beerRecords} for:item="item">
                            <div class="slds-col slds-size_1-of-3 " key={item.Id}>
                                <c-beer-tile beer-record={item} oncart={addToCart}></c-beer-tile>
                            </div> 
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
