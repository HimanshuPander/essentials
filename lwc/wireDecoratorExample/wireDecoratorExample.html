<template>
    <div class="slds-grid slds-wrap slds-gutters">
        <template for:each={accountList} for:item="account">
            <div key={account.Id} class="slds-col slds-size_4-of-12">
                <lightning-card>
                    <p class="slds-p-horizontal_small">{account.Name}</p>
                    <p class="slds-p-horizontal_small">{account.AnnualRevenue}</p>
                </lightning-card>
                <br>
            </div>
        </template>
    </div>
</template>
